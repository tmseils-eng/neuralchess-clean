<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>neuralchess — analysis board</title>
<style>
/* ---------------------------------------------------------------------------
   Design tokens.  One primary (deep teal), warm-neutral greys, and a muted
   bone/sage board.  Nothing here glows, gradients or floats.
   --------------------------------------------------------------------------- */
:root{
  --canvas:#f6f6f7;
  --surface:#ffffff;
  --surface-2:#fafafa;
  --border:#e4e4e7;
  --border-strong:#d4d4d8;
  --ink:#18181b;
  --ink-2:#3f3f46;
  --muted:#71717a;
  --subtle:#a1a1aa;
  --primary:#115e59;
  --primary-hover:#0f4d49;
  --primary-soft:#eef7f5;
  --danger:#9f1239;

  --sq-light:#e9e5db;
  --sq-dark:#98a291;
  --sq-mark:#c8a94b;
  --piece-light:#fbfbfa;
  --piece-dark:#26262a;
  --piece-line:#1b1b1f;

  --r-sm:4px; --r-md:6px; --r-lg:8px;
  --t:150ms cubic-bezier(.4,0,.2,1);
  --mono:"SF Mono",ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#0b0b0c;
    --surface:#141416;
    --surface-2:#1a1a1d;
    --border:rgba(255,255,255,.09);
    --border-strong:rgba(255,255,255,.16);
    --ink:#f4f4f5;
    --ink-2:#d4d4d8;
    --muted:#a1a1aa;
    --subtle:#71717a;
    --primary:#2c8b83;
    --primary-hover:#35a49a;
    --primary-soft:rgba(44,139,131,.12);
    --danger:#e11d48;
    --sq-light:#d9d5cb;
    --sq-dark:#87907f;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:Inter,"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--primary) 55%,transparent);
  border-radius:var(--r-sm);
}

/* --- top bar ------------------------------------------------------------- */
.topbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 24px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:600;letter-spacing:-.01em}
.brand .mark{color:var(--primary)}
.ver{
  font:500 11px/1 var(--mono);color:var(--muted);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 6px;
}
.specs{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.spec{display:flex;flex-direction:column;gap:2px}
.spec dt{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--subtle)}
.spec dd{margin:0;font:500 12px/1.3 var(--mono);color:var(--ink-2)}

/* --- shell --------------------------------------------------------------- */
.shell{
  display:grid;grid-template-columns:minmax(340px,1fr) 372px;gap:24px;
  max-width:1240px;margin:0 auto;padding:24px;align-items:start;
}
@media (max-width:1020px){.shell{grid-template-columns:1fr;padding:16px;gap:16px}}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
}
.card + .card{margin-top:16px}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
.card-head h2{
  margin:0;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);
}
.card-body{padding:16px}
.card-body.tight{padding:8px}

/* --- board --------------------------------------------------------------- */
.board-wrap{
  display:flex;gap:12px;align-items:stretch;
  /* Cap the board so the status bar and the rail stay above the fold on a
     13" laptop; the rail is 372px and the chrome is ~150px. */
  max-width:min(100%, calc(100vh - 172px));
}
.evalbar{
  position:relative;width:14px;flex:0 0 14px;overflow:hidden;
  border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--piece-dark);
}
.evalbar__white{
  position:absolute;left:0;right:0;bottom:0;height:50%;
  background:var(--piece-light);
  transition:height 280ms cubic-bezier(.4,0,.2,1);
}
.evalbar__mid{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--sq-mark);opacity:.75}

.board-shell{position:relative;flex:1;min-width:0}
.board{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  aspect-ratio:1;
  border:1px solid var(--border-strong);border-radius:var(--r-md);overflow:hidden;
  user-select:none;
}
.sq{
  position:relative;display:flex;align-items:center;justify-content:center;
  border:0;padding:0;background:var(--sq-light);cursor:default;
  transition:background-color var(--t);
}
.sq.dark{background:var(--sq-dark)}
.sq.actionable{cursor:pointer}
.sq.mark::after{
  content:"";position:absolute;inset:0;background:var(--sq-mark);opacity:.34;
}
.sq.sel{box-shadow:inset 0 0 0 3px var(--primary)}
.sq.check{box-shadow:inset 0 0 0 3px var(--danger)}
.sq:focus-visible{box-shadow:inset 0 0 0 3px var(--primary);outline:none}
.sq svg{width:86%;height:86%;position:relative;z-index:1;pointer-events:none}
.hint{position:absolute;z-index:1;border-radius:50%;pointer-events:none}
.hint.move{width:22%;height:22%;background:var(--piece-line);opacity:.24}
.hint.capture{inset:8%;border:3px solid var(--piece-line);opacity:.22}
.coord{
  position:absolute;font:600 9px/1 var(--mono);color:var(--piece-line);opacity:.45;
}
.coord.file{bottom:3px;right:4px}
.coord.rank{top:3px;left:4px}

/* --- status -------------------------------------------------------------- */
.statusbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:16px;padding:12px 16px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
}
.turn-dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--border-strong);flex:0 0 8px}
.turn-dot.white{background:var(--piece-light)}
.turn-dot.black{background:var(--piece-dark)}
.turn-dot.thinking{background:var(--primary);border-color:var(--primary);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.status-text{font-weight:500}
.status-text .sub{color:var(--muted);font-weight:400}
.fen{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  font:400 11px/1.4 var(--mono);color:var(--muted);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* --- controls ------------------------------------------------------------ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 12px;border:1px solid var(--border-strong);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;
  cursor:pointer;
  transition:background-color var(--t),border-color var(--t),color var(--t);
}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{background:var(--border)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn[disabled]:hover{background:var(--surface);border-color:var(--border-strong)}
.btn--primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn--primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn--primary:active{background:var(--primary-hover)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row--split{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.field{margin-top:16px}
.field:first-child{margin-top:0}
.field > label,.field > .label{
  display:block;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px;
}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border-strong);border-radius:var(--r-md);overflow:hidden}
.seg button{
  padding:7px 4px;border:0;border-left:1px solid var(--border);background:var(--surface);
  font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-2);
  transition:background-color var(--t),color var(--t);
}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.seg-note{margin-top:6px;font:400 11px/1.4 var(--mono);color:var(--subtle)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.switch-row span{font-size:13px;color:var(--ink-2)}
select.plain{
  border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);
  padding:5px 8px;font-size:12px;cursor:pointer;transition:border-color var(--t);
}
select.plain:hover{border-color:var(--muted)}

/* --- analysis ------------------------------------------------------------ */
.telemetry{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border)}
.telemetry div{padding:10px 12px;border-left:1px solid var(--border)}
.telemetry div:first-child{border-left:0}
.telemetry dt{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
.telemetry dd{margin:2px 0 0;font:500 13px/1.3 var(--mono);color:var(--ink)}

.lines{display:flex;flex-direction:column}
.line{
  display:grid;grid-template-columns:52px 1fr 46px;align-items:center;gap:10px;
  padding:7px 16px;border-top:1px solid var(--border);
  transition:background-color var(--t);
}
.line:first-child{border-top:0}
.line:hover{background:var(--surface-2)}
.line__san{font:500 13px/1 var(--mono)}
.line__bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.line__fill{height:100%;background:var(--primary);border-radius:2px;transition:width 240ms ease}
.line__q{font:400 12px/1 var(--mono);color:var(--muted);text-align:right}
.pv{
  padding:10px 16px;border-top:1px solid var(--border);
  font:400 12px/1.6 var(--mono);color:var(--muted);word-break:break-word;
}
.pv b{color:var(--ink-2);font-weight:500}
.empty{padding:20px 16px;color:var(--subtle);font-size:13px}

/* --- moves --------------------------------------------------------------- */
.moves{max-height:246px;overflow-y:auto}
.moves table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.moves th{
  position:sticky;top:0;background:var(--surface);
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--subtle);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);
}
.moves th.num{width:34px}
.moves th.ev{text-align:right;width:52px}
.moves td{padding:5px 10px;border-bottom:1px solid var(--border);font-size:13px}
.moves tr:last-child td{border-bottom:0}
.moves td.num{color:var(--subtle);font:400 12px/1 var(--mono)}
.moves td.san{font:500 13px/1 var(--mono)}
.moves td.ev{text-align:right;font:400 12px/1 var(--mono);color:var(--muted)}
.moves tr.latest td{background:var(--primary-soft)}

/* --- promotion ----------------------------------------------------------- */
.promo{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--canvas) 78%,transparent);
  border-radius:var(--r-md);z-index:5;
}
.promo[data-open="true"]{display:flex}
.promo__inner{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);
  padding:12px;
}
.promo__title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;text-align:center}
.promo__opts{display:flex;gap:6px}
.promo__opts button{
  width:54px;height:54px;border:1px solid var(--border-strong);border-radius:var(--r-md);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background-color var(--t),border-color var(--t);
}
.promo__opts button:hover{background:var(--surface-2);border-color:var(--primary)}
.promo__opts svg{width:40px;height:40px}

.kbd{
  font:500 10px/1 var(--mono);border:1px solid var(--border-strong);border-bottom-width:2px;
  border-radius:var(--r-sm);padding:3px 5px;color:var(--muted);background:var(--surface-2);
}
.shortcuts{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--border);color:var(--subtle);font-size:11px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <!-- Piece geometry is the same path data the repo's SVG exporter uses
         (neuralchess/render.py), so board images and the UI never diverge. -->
    <symbol id="pc-p" viewBox="0 0 45 45"><path d="M22.5 7.5 a5.5 5.5 0 1 1 -0.01 0 z"/><path d="M17 19 q5.5 3.5 11 0 l2.5 14 h-16 z"/><path d="M9 39 h27 v-3 q0 -3 -4 -3 h-19 q-4 0 -4 3 z"/></symbol>
    <symbol id="pc-r" viewBox="0 0 45 45"><path d="M11 9 h5.5 v3.5 h4 V9 h4 v3.5 h4 V9 h5.5 v8 h-23 z"/><path d="M14 17 h17 l2 16 h-21 z"/><path d="M9 39 h27 v-3 q0 -3 -4 -3 h-19 q-4 0 -4 3 z"/></symbol>
    <symbol id="pc-n" viewBox="0 0 45 45"><path d="M13 33 q0 -13 8 -18 l-3 -3 2.5 -3.5 4 3.5 q8 2 9.5 10 1.2 6 1.2 11 z"/><path d="M25.5 15.5 a1.4 1.4 0 1 1 -0.01 0 z"/><path d="M9 39 h27 v-3 q0 -3 -4 -3 h-19 q-4 0 -4 3 z"/></symbol>
    <symbol id="pc-b" viewBox="0 0 45 45"><path d="M22.5 7 q6.5 6.5 6.5 11.5 0 5.5 -6.5 9.5 -6.5 -4 -6.5 -9.5 0 -5 6.5 -11.5 z"/><path d="M15 29 h15 l1.5 4 h-18 z"/><path d="M9 39 h27 v-3 q0 -3 -4 -3 h-19 q-4 0 -4 3 z"/></symbol>
    <symbol id="pc-q" viewBox="0 0 45 45"><path d="M10 28 l1.5 -14 5 9.5 3 -13.5 3 13.5 3 -13.5 3 13.5 5 -9.5 1.5 14 z"/><path d="M12 31 h21 l1 3 h-23 z"/><path d="M9 39 h27 v-3 q0 -3 -4 -3 h-19 q-4 0 -4 3 z"/></symbol>
    <symbol id="pc-k" viewBox="0 0 45 45"><path d="M21 5 h3 v3 h3 v3 h-3 v4.5 h-3 V11 h-3 V8 h3 z"/><path d="M13 33 q-3.5 -13 4 -16 3.2 -1.2 5.5 2 2.3 -3.2 5.5 -2 7.5 3 4 16 z"/><path d="M9 39 h27 v-3 q0 -3 -4 -3 h-19 q-4 0 -4 3 z"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand"><span>neural<span class="mark">chess</span></span></div>
  <span class="ver" id="ver">v0.1.0</span>
  <dl class="specs" id="specs"></dl>
</header>

<main class="shell">
  <section>
    <div class="board-wrap">
      <div class="evalbar" id="evalbar" role="img" aria-label="Evaluation bar">
        <div class="evalbar__white" id="evalWhite"></div>
        <div class="evalbar__mid"></div>
      </div>
      <div class="board-shell">
        <div class="board" id="board" role="grid" aria-label="Chess board"></div>
        <div class="promo" id="promo" role="dialog" aria-modal="true" aria-label="Choose promotion piece">
          <div class="promo__inner">
            <div class="promo__title">Promote to</div>
            <div class="promo__opts" id="promoOpts"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <span class="turn-dot white" id="turnDot" aria-hidden="true"></span>
      <span class="status-text" id="status">Loading engine…</span>
      <span class="fen"><span id="fen"></span></span>
      <button class="btn" id="copyFen" title="Copy FEN">Copy FEN</button>
    </div>
  </section>

  <aside>
    <div class="card">
      <div class="card-head"><h2>Game</h2><span id="ply" class="line__q"></span></div>
      <div class="card-body">
        <div class="btn-row--split">
          <button class="btn btn--primary" id="newWhite">New game as White</button>
          <button class="btn" id="newBlack">as Black</button>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn" id="undo">Undo</button>
          <button class="btn" id="flip">Flip</button>
          <button class="btn" id="hint">Hint</button>
          <button class="btn" id="copyPgn">Copy PGN</button>
        </div>

        <div class="field">
          <span class="label" id="strengthLabel">Search budget</span>
          <div class="seg" id="strength" role="group" aria-labelledby="strengthLabel"></div>
          <div class="seg-note" id="strengthNote">—</div>
        </div>

        <div class="switch-row">
          <span>Move selection</span>
          <select class="plain" id="temp" aria-label="Move selection policy">
            <option value="0">Best move</option>
            <option value="0.25">Slightly varied</option>
            <option value="0.6">Exploratory</option>
          </select>
        </div>
      </div>
      <div class="shortcuts">
        <span><span class="kbd">N</span> new</span>
        <span><span class="kbd">U</span> undo</span>
        <span><span class="kbd">F</span> flip</span>
        <span><span class="kbd">H</span> hint</span>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Analysis</h2><span class="line__q" id="netEval"></span></div>
      <dl class="telemetry">
        <div><dt>Eval</dt><dd id="tEval">—</dd></div>
        <div><dt>Depth</dt><dd id="tDepth">—</dd></div>
        <div><dt>Nodes</dt><dd id="tNodes">—</dd></div>
        <div><dt>Speed</dt><dd id="tNps">—</dd></div>
      </dl>
      <div class="lines" id="lines"><div class="empty">Play a move to see the search.</div></div>
      <div class="pv" id="pv" hidden></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Moves</h2><span class="line__q" id="result"></span></div>
      <div class="moves" id="moves"><div class="empty">No moves yet.</div></div>
    </div>
  </aside>
</main>

<script>
"use strict";

const FILES = "abcdefgh";
const GLYPH = {p:"pc-p",n:"pc-n",b:"pc-b",r:"pc-r",q:"pc-q",k:"pc-k"};
const BUDGETS = [
  {label:"Quick",   nodes:120},
  {label:"Standard",nodes:400},
  {label:"Deep",    nodes:1000},
  {label:"Maximum", nodes:2400},
];
const $ = (id) => document.getElementById(id);

const state = {
  moves: [], san: [], evals: [],
  fen: "", legal: [], turn: "white", outcome: null, reason: null, check: false,
  human: "white", flipped: false, selected: null, lastMove: null,
  busy: false, budget: 1, lastNps: null, meta: null,
};

const post = (path, body) =>
  fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
               body: JSON.stringify(body)}).then(r => r.json());

/* ---------- rendering --------------------------------------------------- */

function parseFen(fen){
  const grid = {};
  fen.split(" ")[0].split("/").forEach((row, i) => {
    const rank = 8 - i; let file = 0;
    for (const ch of row){
      if (ch >= "1" && ch <= "8"){ file += +ch; continue; }
      grid[FILES[file] + rank] = ch; file++;
    }
  });
  return grid;
}

function pieceSvg(letter){
  const white = letter === letter.toUpperCase();
  return `<svg viewBox="0 0 45 45" aria-hidden="true">
    <use href="#${GLYPH[letter.toLowerCase()]}"
         fill="${white ? "var(--piece-light)" : "var(--piece-dark)"}"
         stroke="var(--piece-line)" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

const PIECE_NAME = {p:"pawn",n:"knight",b:"bishop",r:"rook",q:"queen",k:"king"};

function renderBoard(){
  const grid = parseFen(state.fen || "8/8/8/8/8/8/8/8 w");
  const board = $("board");
  const ranks = state.flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const files = state.flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  const targets = state.selected
    ? state.legal.filter(m => m.slice(0,2) === state.selected).map(m => m.slice(2,4))
    : [];
  const myTurn = !state.busy && !state.outcome && state.turn === state.human;
  const frag = document.createDocumentFragment();

  for (const rank of ranks){
    for (const f of files){
      const name = FILES[f] + rank;
      const piece = grid[name];
      const sq = document.createElement("button");
      sq.type = "button";
      sq.className = "sq" + ((f + rank) % 2 ? "" : " dark");
      sq.dataset.square = name;
      sq.setAttribute("role", "gridcell");
      sq.tabIndex = -1;

      const movable = myTurn && (state.legal.some(m => m.slice(0,2) === name) || targets.includes(name));
      if (movable){ sq.classList.add("actionable"); sq.tabIndex = 0; }
      if (state.lastMove && (state.lastMove.slice(0,2) === name || state.lastMove.slice(2,4) === name))
        sq.classList.add("mark");
      if (state.selected === name) sq.classList.add("sel");
      if (state.check && piece && piece.toLowerCase() === "k" &&
          (piece === "K") === (state.turn === "white")) sq.classList.add("check");

      if (piece) sq.innerHTML = pieceSvg(piece);
      if (targets.includes(name)){
        const dot = document.createElement("span");
        dot.className = "hint " + (piece ? "capture" : "move");
        sq.appendChild(dot);
      }
      if (rank === (state.flipped ? 8 : 1))
        sq.insertAdjacentHTML("beforeend", `<span class="coord file">${FILES[f]}</span>`);
      if (f === (state.flipped ? 7 : 0))
        sq.insertAdjacentHTML("beforeend", `<span class="coord rank">${rank}</span>`);

      sq.setAttribute("aria-label",
        piece ? `${name}, ${piece === piece.toUpperCase() ? "white" : "black"} ${PIECE_NAME[piece.toLowerCase()]}`
              : `${name}, empty`);
      sq.addEventListener("click", () => onSquare(name));
      frag.appendChild(sq);
    }
  }
  board.replaceChildren(frag);
}

function renderMoves(){
  const box = $("moves");
  if (!state.san.length){ box.innerHTML = '<div class="empty">No moves yet.</div>'; return; }
  let html = '<table><thead><tr><th class="num">#</th><th>White</th><th>Black</th>' +
             '<th class="ev">Eval</th></tr></thead><tbody>';
  for (let i = 0; i < state.san.length; i += 2){
    const last = i + 2 > state.san.length - 1;
    const ev = state.evals[i + 1] ?? state.evals[i];
    html += `<tr class="${last ? "latest" : ""}"><td class="num">${i/2 + 1}</td>` +
            `<td class="san">${state.san[i] || ""}</td>` +
            `<td class="san">${state.san[i+1] || ""}</td>` +
            `<td class="ev">${ev == null ? "" : fmtEval(ev)}</td></tr>`;
  }
  box.innerHTML = html + "</tbody></table>";
  box.scrollTop = box.scrollHeight;
}

const fmtEval = (cp) => (cp > 0 ? "+" : cp < 0 ? "−" : "") + (Math.abs(cp)/100).toFixed(2);

function renderSearch(d){
  if (!d || !d.top || !d.top.length){
    $("lines").innerHTML = '<div class="empty">Play a move to see the search.</div>';
    $("pv").hidden = true;
    return;
  }
  const max = Math.max(...d.top.map(t => t.visits));
  $("lines").innerHTML = d.top.map(t => `
    <div class="line">
      <span class="line__san">${t.san}</span>
      <span class="line__bar"><span class="line__fill" style="width:${(100*t.visits/max).toFixed(1)}%"></span></span>
      <span class="line__q">${t.q >= 0 ? "+" : "−"}${Math.abs(t.q).toFixed(2)}</span>
    </div>`).join("");
  const pv = $("pv");
  pv.hidden = false;
  pv.innerHTML = "<b>PV</b> " + (d.pvSan || d.pv || []).join(" ");
}

function renderTelemetry(d){
  const white = state.turn === "white" ? 1 : -1;   // d.cp is from the mover
  $("tEval").textContent  = d ? fmtEval(d.cp * white) : "—";
  $("tDepth").textContent = d ? d.depth : "—";
  $("tNodes").textContent = d ? d.nodes.toLocaleString() : "—";
  $("tNps").textContent   = d ? `${Math.round(d.nps).toLocaleString()} n/s` : "—";
  if (d && d.wdl){
    // The network reports from the side to move; the panel is White-oriented
    // throughout, so flip it when Black is on move.
    const w = state.turn === "white" ? d.wdl.win : d.wdl.loss;
    const l = state.turn === "white" ? d.wdl.loss : d.wdl.win;
    const pct = (x) => Math.round(x * 100);
    $("netEval").textContent =
      `raw net · W ${pct(w)}% D ${pct(d.wdl.draw)}% L ${pct(l)}%`;
  } else {
    $("netEval").textContent = "";
  }
}

function setEvalBar(cpWhite){
  const pct = 100 / (1 + Math.pow(10, -cpWhite / 400));
  $("evalWhite").style.height = Math.max(3, Math.min(97, pct)) + "%";
  $("evalbar").setAttribute("aria-label", `Evaluation ${fmtEval(cpWhite)} for White`);
}

function renderStrength(){
  $("strength").innerHTML = BUDGETS.map((b, i) =>
    `<button type="button" aria-pressed="${i === state.budget}" data-i="${i}">${b.label}</button>`).join("");
  $("strength").querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { state.budget = +b.dataset.i; renderStrength(); });
  });
  const nodes = BUDGETS[state.budget].nodes;
  const est = state.lastNps ? ` · ≈${(nodes / state.lastNps).toFixed(1)}s per move` : "";
  $("strengthNote").textContent = `${nodes.toLocaleString()} nodes${est}`;
}

function renderStatus(extra){
  const dot = $("turnDot");
  dot.className = "turn-dot " + (state.busy ? "thinking" : state.turn);
  let text;
  if (state.outcome){
    const who = state.outcome === "1-0" ? "White wins" :
                state.outcome === "0-1" ? "Black wins" : "Draw";
    text = `<strong>${who}</strong> <span class="sub">— ${state.reason}</span>`;
    $("result").textContent = state.outcome;
  } else if (state.busy){
    text = `Searching <span class="sub">— ${BUDGETS[state.budget].nodes.toLocaleString()} nodes</span>`;
  } else {
    const move = Math.floor(state.moves.length / 2) + 1;
    const side = state.turn === state.human ? "Your move" : "Engine to move";
    text = `${side} <span class="sub">— move ${move}${state.check ? ", check" : ""}</span>`;
    $("result").textContent = "";
  }
  $("status").innerHTML = text + (extra ? ` <span class="sub">· ${extra}</span>` : "");
  $("ply").textContent = state.moves.length ? `${state.moves.length} plies` : "";
  $("undo").disabled = state.busy || state.moves.length < 1;
  $("hint").disabled = state.busy || !!state.outcome;
}

/* ---------- interaction ------------------------------------------------- */

async function refresh(extra){
  const d = await post("/api/state", {moves: state.moves});
  Object.assign(state, {
    fen: d.fen, legal: d.legal, turn: d.turn,
    outcome: d.outcome, reason: d.reason, check: d.check, san: d.san,
  });
  $("fen").textContent = d.fen;
  renderBoard(); renderMoves(); renderStatus(extra);
  return d;
}

function onSquare(name){
  if (state.busy || state.outcome || state.turn !== state.human) return;
  if (state.selected){
    const options = state.legal.filter(
      m => m.slice(0,2) === state.selected && m.slice(2,4) === name);
    if (!options.length){
      state.selected = state.legal.some(m => m.slice(0,2) === name) ? name : null;
      renderBoard();
      return;
    }
    if (options.length > 1){ openPromotion(options); return; }
    playHuman(options[0]);
    return;
  }
  if (state.legal.some(m => m.slice(0,2) === name)){ state.selected = name; renderBoard(); }
}

function openPromotion(options){
  const white = state.human === "white";
  $("promoOpts").innerHTML = options.map(uci => {
    const piece = uci[4] || "q";
    return `<button type="button" data-uci="${uci}" aria-label="Promote to ${PIECE_NAME[piece]}">
      <svg viewBox="0 0 45 45"><use href="#${GLYPH[piece]}"
        fill="${white ? "var(--piece-light)" : "var(--piece-dark)"}"
        stroke="var(--piece-line)" stroke-width="1.4" stroke-linejoin="round"/></svg></button>`;
  }).join("");
  $("promoOpts").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      $("promo").dataset.open = "false";
      playHuman(b.dataset.uci);
    }));
  $("promo").dataset.open = "true";
  $("promoOpts").querySelector("button").focus();
}

async function playHuman(uci){
  state.selected = null;
  state.lastMove = uci;
  state.moves.push(uci);
  state.evals.push(null);
  await refresh();
  if (!state.outcome) await engineMove();
}

async function engineMove(){
  state.busy = true;
  renderStatus();
  renderBoard();
  const nodes = BUDGETS[state.budget].nodes;
  const d = await post("/api/engine", {
    moves: state.moves, simulations: nodes, temperature: +$("temp").value,
  });
  state.busy = false;
  if (d.bestmove){
    const whiteView = (state.turn === "white" ? 1 : -1) * d.cp;
    state.moves.push(d.bestmove);
    state.evals.push(whiteView);
    state.lastMove = d.bestmove;
    state.lastNps = d.nps;
    renderSearch(d); renderTelemetry(d); setEvalBar(whiteView); renderStrength();
  }
  await refresh();
}

async function newGame(color){
  Object.assign(state, {
    moves: [], evals: [], selected: null, lastMove: null,
    human: color, flipped: color === "black", outcome: null, busy: false,
  });
  renderSearch(null); renderTelemetry(null); setEvalBar(0);
  await refresh();
  if (color === "black") await engineMove();
}

async function copy(text, note){
  try { await navigator.clipboard.writeText(text); renderStatus(note); }
  catch { renderStatus("clipboard unavailable"); }
}

/* ---------- wiring ------------------------------------------------------ */

$("newWhite").onclick = () => newGame("white");
$("newBlack").onclick = () => newGame("black");
$("flip").onclick = () => { state.flipped = !state.flipped; renderBoard(); };
$("undo").onclick = async () => {
  if (state.busy) return;
  const drop = state.turn === state.human ? 2 : 1;
  state.moves = state.moves.slice(0, Math.max(0, state.moves.length - drop));
  state.evals = state.evals.slice(0, state.moves.length);
  state.lastMove = state.moves.at(-1) || null;
  state.selected = null;
  await refresh();
};
$("hint").onclick = async () => {
  if (state.busy || state.outcome) return;
  state.busy = true; renderStatus();
  const d = await post("/api/engine",
    {moves: state.moves, simulations: BUDGETS[state.budget].nodes});
  state.busy = false;
  if (d.bestmove){
    state.lastNps = d.nps;
    renderSearch(d); renderTelemetry(d); renderStrength();
    setEvalBar((state.turn === "white" ? 1 : -1) * d.cp);
  }
  await refresh(d.bestmoveSan ? `suggests <strong>${d.bestmoveSan}</strong>` : "");
};
$("copyPgn").onclick = async () => {
  const d = await post("/api/pgn", {moves: state.moves, headers: {
    White: state.human === "white" ? "Human" : "neuralchess",
    Black: state.human === "white" ? "neuralchess" : "Human",
  }});
  copy(d.pgn, "PGN copied");
};
$("copyFen").onclick = () => copy(state.fen, "FEN copied");

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const key = e.key.toLowerCase();
  if (key === "n") $("newWhite").click();
  else if (key === "u") $("undo").click();
  else if (key === "f") $("flip").click();
  else if (key === "h") $("hint").click();
  else if (key === "escape" && state.selected){ state.selected = null; renderBoard(); }
});

(async function boot(){
  try {
    const meta = await fetch("/api/meta").then(r => r.json());
    state.meta = meta;
    $("ver").textContent = "v" + meta.version;
    $("specs").innerHTML = [
      ["Network", `${meta.blocks}×${meta.channels}${meta.squeezeExcitation ? " + SE" : ""}`],
      ["Parameters", meta.parameters.toLocaleString()],
      ["Value head", meta.valueHead],
      ["Weights", meta.checkpoint || "untrained"],
    ].map(([k, v]) => `<div class="spec"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  } catch { /* header stays minimal if metadata is unavailable */ }
  renderStrength();
  await newGame("white");
})();
</script>
</body>
