name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check neuralchess tests scripts
      - name: Unit tests
        run: pytest -q
      - name: Move generator (perft)
        run: python -m neuralchess perft --depth 4

  no-dependency-run:
    name: runs with NumPy alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy only
        run: pip install numpy
      - name: Bundled test runner
        run: python scripts/run_tests.py
      - name: End-to-end training smoke test
        run: |
          python -m neuralchess train --config configs/tiny.json \
            --iterations 2 --games-per-iteration 2 --steps-per-iteration 5 \
            --output-dir /tmp/ci-runs --run-name smoke
      - name: UCI protocol handshake
        run: printf 'uci\nisready\nposition startpos\ngo nodes 32\nquit\n' | python -m neuralchess uci

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t neuralchess .
