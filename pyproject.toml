[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralchess"
version = "0.1.0"
description = "An AlphaZero-style chess engine written from scratch: bitboard rules, NumPy autograd, and batched PUCT search"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tyler Seils", email = "tmseils@wisc.edu" }]
keywords = ["chess", "alphazero", "reinforcement-learning", "mcts", "deep-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "ruff>=0.15,<0.16"]

[project.scripts]
neuralchess = "neuralchess.cli:main"

[project.urls]
Homepage = "https://github.com/tmseils-eng/neuralchess"
Issues = "https://github.com/tmseils-eng/neuralchess/issues"

[tool.setuptools.packages.find]
include = ["neuralchess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# UP (pyupgrade) is deliberately excluded: it rewrites Optional[X] to X | None,
# which is not valid at runtime on Python 3.9, and this package supports 3.9.
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]
